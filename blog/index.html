<!DOCTYPE html>
<!-- ============================================================
     blog-template.html — ブログ詳細ページ動的テンプレート
     client-site-all-in-one 用ベース
     ============================================================
     使い方：
       1. 以下のプレースホルダーを置換して blog/index.html として保存
          - https://casaflor.search-mania.net         例: https://thai-raksaa.search-mania.net
          - 株式会社カーサフロール    例: タイ古式 RAKSAA
          - https://script.google.com/macros/s/AKfycbxn5fJlnt9smKFwgYlp25Zohq4k815Pkjl_edbAki8nDMOiFC1rXLbH4Etklg9tn9lrMg/exec          GAS Web App デプロイURL
          - #FDF8F3               本文背景色   例: #FAF7F2
          - #2B2622              本文文字色   例: #2B2622
          - #6B5D50         本文淡色     例: #4A4540
          - #1A1614        ヘッダー背景 例: #2B2622
          - #FDF8F3     ヘッダー文字 例: #FAF7F2
          - #C85A33           アクセント色 例: #C9A84C
          - rgba(200, 90, 51, 0.14)     アクセント淡 例: rgba(201,168,76,.2)
          - #8E8678            グレー       例: #8E8678

       2. Netlify rewrite で /blog/* → /blog/index.html に流す
          （netlify.toml に設定済み）

       3. このページは Sheets blog タブをリアルタイムで読むので
          Sheetsを編集すれば即時反映される

       ※ GAS Code.gs 側で ?blog_all=1 パラメータに対応している必要あり
         （assets/Code.gs では実装済み）
     ============================================================ -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1A1614">
<title>株式会社カーサフロール ブログ</title>
<meta name="description" content="株式会社カーサフロール からのお知らせ・最新情報">
<meta http-equiv="content-language" content="ja">

<!-- OGP（JS で動的に上書き） -->
<meta property="og:type" content="article">
<meta property="og:site_name" content="株式会社カーサフロール">
<meta property="og:locale" content="ja_JP">
<meta property="og:image" content="https://casaflor.search-mania.net/ogp.svg">

<link rel="icon" type="image/svg+xml" href="/favicon.svg">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#FDF8F3;
  color:#2B2622;
  font-family:'Noto Sans JP','Hiragino Sans',sans-serif;
  line-height:1.85;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
header{
  background:#1A1614;
  padding:16px 20px;
  text-align:center;
  border-bottom:1px solid rgba(200, 90, 51, 0.14);
  position:sticky;top:0;z-index:10;
}
header a{
  color:#FDF8F3;
  text-decoration:none;
  font-size:17px;

  font-family:'Noto Serif JP',serif;

}

  max-width:720px;
  margin:60px auto;

}

}

  content:'読 み 込 み 中 …';

.card{

  display:block;
}
.card h1{
  margin:14px 0 28px;
  font-size:22px;
  line-height:1.7;

  font-family:'Noto Serif JP',serif;

  letter-spacing:.04em;
}

}

  .card h1{font-size:19px;margin:12px 0 22px}
  .card .text{font-size:14.5px;line-height:1.95}
  header a{font-size:14px;letter-spacing:.28em}
  .back-btn{padding:13px 28px;font-size:12px}
}
/* === LIST モード（?post= なし） === */
.list-head { text-align: center; padding: 20px 0 40px; }
.list-eyebrow { font-family: Georgia, serif; font-size: 11px; letter-spacing: .3em; color: #A07830; margin-bottom: 12px; }
.list-title { font-family: 'Noto Serif JP', serif; font-size: clamp(26px, 3.4vw, 40px); font-weight: 500; color: #2B2622; margin: 0 0 10px; letter-spacing: .04em; }
.list-sub { font-size: 13px; color: #6B5D50; letter-spacing: .1em; }
.post-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 24px; }
.post-item { display: flex; flex-direction: column; background: #fff; border: 1px solid rgba(201,168,76,.25); border-radius: 8px; overflow: hidden; box-shadow: 0 6px 20px rgba(200,90,51,.08); transition: transform .3s, box-shadow .3s; color: inherit; text-decoration: none; }
.post-item:hover { transform: translateY(-4px); box-shadow: 0 14px 32px rgba(200,90,51,.18); }
.post-item__img { width: 100%; aspect-ratio: 4/3; background: #F5EADB; overflow: hidden; }
.post-item__img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.post-item__img--none { background: linear-gradient(135deg, #F5EADB, #F5E6E6); }
.post-item__body { padding: 18px 20px 22px; display: flex; flex-direction: column; gap: 8px; }
.post-item__date { font-family: Georgia, serif; font-size: 12px; color: #A07830; letter-spacing: .06em; }
.post-item__title { font-family: 'Noto Serif JP', serif; font-size: 15px; line-height: 1.6; font-weight: 500; color: #2B2622; margin: 0; word-break: break-word; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; min-height: 4.8em; }
.post-item:hover .post-item__title { color: #C85A33; }
.post-item__cta { font-size: 12px; color: #C85A33; letter-spacing: .06em; margin-top: 4px; }
@media (max-width: 900px) { .post-grid { grid-template-columns: repeat(2, 1fr); gap: 20px; } }
@media (max-width: 600px) { .post-grid { grid-template-columns: 1fr; } }

/* === カテゴリタブ === */
.cat-tabs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 0 auto 30px; padding: 0 8px; max-width: 1000px; }
.cat-tab { display: inline-block; padding: 8px 16px; background: #fff; border: 1px solid rgba(201,168,76,.35); border-radius: 100px; font-size: 12.5px; color: #6B5D50; text-decoration: none; transition: all .25s; letter-spacing: .04em; }
.cat-tab:hover { background: rgba(200,90,51,.08); color: #C85A33; border-color: #C85A33; }
.cat-tab--active { background: #C85A33; color: #fff; border-color: #C85A33; font-weight: 600; box-shadow: 0 4px 12px rgba(200,90,51,.25); }
.cat-tab--active:hover { background: #A0451F; color: #fff; }
@media (max-width: 600px) { .cat-tab { padding: 7px 12px; font-size: 12px; } }
</style>
</head>
<body>

<header><a href="https://casaflor.search-mania.net/">株式会社カーサフロール</a></header>

<div class="wrap" id="root">
  <div class="loading"></div>
</div>

<script>
/* ============================================================
   設定（テンプレ置換時に埋め込まれる）
   ============================================================ */
const GAS_URL    = 'https://script.google.com/macros/s/AKfycbxn5fJlnt9smKFwgYlp25Zohq4k815Pkjl_edbAki8nDMOiFC1rXLbH4Etklg9tn9lrMg/exec';
const SITE_URL   = 'https://casaflor.search-mania.net';
const STORE_NAME = '株式会社カーサフロール';

/* ============================================================
   ユーティリティ
   ============================================================ */
function esc(s) {
  return String(s || '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function fmtDate(s) {
  if (!s) return '';
  const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? m[1] + '.' + m[2] + '.' + m[3] : String(s);
}

/* Drive 共有URL → 永続的な高解像度サムネイル
   - Drive webViewLink （/d/<ID>/）対応
   - lh3.googleusercontent.com（=s220 などサイズ指定）対応
   - 既に thumbnail URL の場合はサイズ部分を w1200 に書き換え */
function driveImg(url) {
  if (!url) return '';
  const s = String(url).trim();
  const m1 = s.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (m1) return 'https://drive.google.com/thumbnail?id=' + m1[1] + '&sz=w1200';
  const m2 = s.match(/lh3\.googleusercontent\.com\/d\/([a-zA-Z0-9_-]+)/);
  if (m2) return 'https://lh3.googleusercontent.com/d/' + m2[1] + '=w1200';
  if (s.indexOf('drive.google.com/thumbnail') !== -1) {
    return s.replace(/([?&]sz=)[^&]*/, '$1w1200');
  }
  return s;
}

/* URLからスラッグを抽出
   ① クエリパラメータ方式（推奨）: /blog/?post=2026-05-28-2052
      → Cloudflare Pages の静的ファイル直配信で動く（_redirects 不要）
   ② パスベース方式（フォールバック）: /blog/2026-05-28-2052/
      → _redirects の200リライト経由 */
function getSlug() {
  const params = new URLSearchParams(location.search);
  if (params.get('post')) return params.get('post');
  const m = location.pathname.match(/\/blog\/([^\/]+)\/?$/);
  return m ? m[1] : '';
}

/* &n=INDEX パラメータを取得（同日・同URL記事のtiebreaker） */
function getN() {
  const params = new URLSearchParams(location.search);
  const n = params.get('n');
  return (n !== null && n !== '') ? parseInt(n, 10) : -1;
}

/* 記事検索。優先順位:
   ① n（配列インデックス）が有効 → 直接参照（最優先・同日重複対策）
   ② b.url にスラッグが含まれる → URLマッチ
   ③ b.date === slug → 日付完全一致（旧URL対応）
   ⚠️ slug.indexOf(d) === 0 は同日別記事と誤マッチするため使わない */
function findBySlug(items, slug, n) {
  if (!Array.isArray(items)) return null;
  // ① スラッグでURLマッチ（最優先・確実）
  if (slug) {
    var bySlug = items.find(function(b) {
      if (!b || !b.url) return false;
      return b.url.indexOf('/blog/' + slug + '/') !== -1
          || b.url.indexOf('/blog/' + slug) !== -1
          || b.url === slug
          || b.url.slice(-slug.length - 1) === slug + '/';
    });
    if (bySlug) return bySlug;
    // ② 日付完全一致（旧URL対応）
    var byDate = items.find(function(b) {
      if (!b || !b.date) return false;
      var d = String(b.date).replace(/[\/\.]/g, '-').replace(/[^0-9-]/g, '');
      return d === slug;
    });
    if (byDate) return byDate;
  }
  // ③ n（配列インデックス）にフォールバック（同日重複の tiebreaker）
  if (n >= 0 && n < items.length && items[n]) return items[n];
  return null;
}

/* メタタグ動的更新（OGP・description・canonical） */
function updateMeta(title, desc, imgUrl) {
  document.title = title + ' | ' + STORE_NAME;

  const m1 = document.querySelector('meta[name="description"]');
  if (m1) m1.setAttribute('content', desc);

  function upsertMeta(attrName, attrValue, contentValue) {
    let el = document.querySelector('meta[' + attrName + '="' + attrValue + '"]');
    if (!el) {
      el = document.createElement('meta');
      el.setAttribute(attrName, attrValue);
      document.head.appendChild(el);
    }
    el.setAttribute('content', contentValue);
  }
  upsertMeta('property', 'og:title', title);
  upsertMeta('property', 'og:description', desc);
  /* location.search も含める（?post=SLUG）ことで各記事が固有の canonical / og:url を持つ
     location.pathname だけだと全記事が /blog/ を canonical にしてしまい重複扱いになる */
  upsertMeta('property', 'og:url', SITE_URL + location.pathname + location.search);
  upsertMeta('name', 'twitter:title', title);
  upsertMeta('name', 'twitter:description', desc);
  if (imgUrl) {
    upsertMeta('property', 'og:image', imgUrl);
    upsertMeta('name', 'twitter:image', imgUrl);
  }

  let canonical = document.querySelector('link[rel="canonical"]');
  if (!canonical) {
    canonical = document.createElement('link');
    canonical.setAttribute('rel', 'canonical');
    document.head.appendChild(canonical);
  }
  canonical.setAttribute('href', SITE_URL + location.pathname + location.search);
}

/* レンダリング */
function render(item) {
  const root = document.getElementById('root');

  if (!item) {
    root.innerHTML =
      '<div class="not-found">' +
        '<h1>記事が見つかりません</h1>' +
        '<p>指定された記事は削除されたか、URLが正しくない可能性があります。</p>' +
        '<a class="back-btn" href="' + esc(SITE_URL) + '/">← トップへ戻る</a>' +
      '</div>';
    document.title = '記事が見つかりません | ' + STORE_NAME;
    return;
  }

  const imgUrl = driveImg(item.image);
  // タイトルが空なら本文の最初の1文（句点まで）or 日付ベース
  let title = (item.title || '').trim();
  if (!title && item.body) {
    title = String(item.body).split(/[。\n]/)[0].trim();
  }
  if (!title && item.date) {
    title = fmtDate(item.date) + ' の投稿';
  }
  const desc = (item.body || title).slice(0, 120);

  updateMeta(title, desc, imgUrl);

  // BlogPosting 構造化データ（GoogleがJSレンダリング時に認識 → リッチリザルト対応）
  (function() {
    var existing = document.getElementById('blog-jsonld');
    if (existing) existing.remove();
    var sd = document.createElement('script');
    sd.id = 'blog-jsonld';
    sd.type = 'application/ld+json';
    sd.textContent = JSON.stringify({
      '@context': 'https://schema.org',
      '@type': 'BlogPosting',
      'headline': title,
      'description': desc,
      'datePublished': item.date || '',
      'image': imgUrl || '',
      'url': SITE_URL + location.pathname + location.search,
      'publisher': {
        '@type': 'Organization',
        'name': STORE_NAME,
        'url': SITE_URL
      }
    });
    document.head.appendChild(sd);
  })();

  root.innerHTML =
    '<article class="card">' +
      (imgUrl ? '<img src="' + esc(imgUrl) + '" alt="' + esc(title) + '" loading="eager">' : '') +
      '<div class="card-body">' +
        (item.date ? '<span class="date">' + esc(fmtDate(item.date)) + '</span>' : '') +
        (item.title && item.title.trim() ? '<h1>' + esc(item.title) + '</h1>' : '') +
        '<p class="text">' + esc(item.body || '') + '</p>' +
      '</div>' +
    '</article>' +
    '<div class="back-wrap">' +
      '<a class="back-btn" href="' + esc(SITE_URL) + '/">← トップへ戻る</a>' +
    '</div>' +
    '<div class="produced-by">' +
      'Produced by <a href="https://search-mania.net/" target="_blank" rel="noopener noreferrer">SearchMania Inc.</a>' +
    '</div>';
}

/* カテゴリ slug → 日本語ラベルマップ */
var CAT_MAP = {
  case: '施工事例',
  tile: 'タイル',
  waterproof: '防水',
  okinawa: '沖縄気候',
  hotel: 'ホテル',
  maintenance: 'メンテナンス',
  women: '女性目線',
  trouble: 'トラブル'
};

/* 記事一覧モードのレンダリング */
function renderList(items) {
  const root = document.getElementById('root');
  var allList = (items || []).filter(function(b) { return b && (b.body || b.title); });
  var catParam = new URLSearchParams(location.search).get('cat');
  var filterCat = catParam ? (CAT_MAP[catParam] || catParam) : null;
  var list = filterCat
    ? allList.filter(function(b) { return (b.category || '').indexOf(filterCat) !== -1; })
    : allList;
  var pageTitle = filterCat ? filterCat + ' の記事一覧' : 'すべての記事一覧';
  document.title = pageTitle + ' | ' + STORE_NAME;
  var descText = STORE_NAME + 'が発信する' + (filterCat ? filterCat + 'カテゴリの記事、全' + list.length + '件。' : '内外装・タイル・防水・沖縄気候対応など、全' + list.length + '件の記事一覧。');
  updateMeta(pageTitle, descText, SITE_URL + '/ogp.png');
  // カテゴリタブ生成（現在アクティブなカテゴリを強調）
  function buildCatTabs() {
    var tabs = '<div class="cat-tabs">' +
      '<a href="/blog/" class="cat-tab' + (filterCat ? '' : ' cat-tab--active') + '">すべて (' + allList.length + ')</a>';
    Object.keys(CAT_MAP).forEach(function(slug) {
      var label = CAT_MAP[slug];
      var count = allList.filter(function(b) { return (b.category || '').indexOf(label) !== -1; }).length;
      tabs += '<a href="/blog/?cat=' + slug + '" class="cat-tab' + (filterCat === label ? ' cat-tab--active' : '') + '">' + label + ' (' + count + ')</a>';
    });
    tabs += '</div>';
    return tabs;
  }

  if (!list.length) {
    root.innerHTML =
      '<div class="list-head">' +
        '<div class="list-eyebrow">JOURNAL — ARCHIVE</div>' +
        '<h1 class="list-title">' + esc(pageTitle) + '</h1>' +
        '<p class="list-sub">まだ記事がありません。</p>' +
      '</div>' +
      buildCatTabs() +
      '<div class="back-wrap"><a class="back-btn" href="' + esc(SITE_URL) + '/">← トップへ戻る</a></div>';
    return;
  }
  root.innerHTML =
    '<div class="list-head">' +
      '<div class="list-eyebrow">JOURNAL — ARCHIVE</div>' +
      '<h1 class="list-title">' + esc(pageTitle) + '</h1>' +
      '<p class="list-sub">全 ' + list.length + ' 件（新しい順）</p>' +
    '</div>' +
    buildCatTabs() +
    '<div class="post-grid">' +
      list.map(function(post, i) {
        var img = driveImg(post.image);
        var rawTitle = (post.title || '').trim();
        if (!rawTitle && post.body) rawTitle = String(post.body).split(/[。\n]/)[0].trim();
        if (!rawTitle && post.date) rawTitle = fmtDate(post.date) + ' の投稿';
        rawTitle = rawTitle.replace(/^[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{1F000}-\u{1F2FF}\s]+/u, '').replace(/^#\s*/, '').trim();
        var slugMatch = (post.url || '').match(/\/blog\/([^\/\?#]+)/);
        var slug = slugMatch ? slugMatch[1] : (post.date || '');
        var href = slug ? '/blog/?post=' + slug + '&n=' + i : '#';
        return '<a href="' + href + '" class="post-item">' +
          (img ? '<div class="post-item__img"><img src="' + esc(img) + '" alt="" loading="lazy"></div>' : '<div class="post-item__img post-item__img--none"></div>') +
          '<div class="post-item__body">' +
            (post.date ? '<time class="post-item__date">' + esc(fmtDate(post.date)) + '</time>' : '') +
            '<h3 class="post-item__title">' + esc(rawTitle) + '</h3>' +
            '<span class="post-item__cta">続きを読む →</span>' +
          '</div>' +
        '</a>';
      }).join('') +
    '</div>' +
    '<div class="back-wrap">' +
      '<a class="back-btn" href="' + esc(SITE_URL) + '/">← トップへ戻る</a>' +
    '</div>' +
    '<div class="produced-by">' +
      'Produced by <a href="https://search-mania.net/" target="_blank" rel="noopener noreferrer">SearchMania Inc.</a>' +
    '</div>';
}

/* 起動 */
(function init() {
  const slug = getSlug();
  const n    = getN();
  if (!slug && n < 0) {
    // LIST モード：全件取得して一覧表示
    fetch(GAS_URL + (GAS_URL.indexOf('?') >= 0 ? '&' : '?') + 'blog_all=1')
      .then(function(r) { return r.json(); })
      .then(function(data) { renderList(data && data.blog); })
      .catch(function(err) {
        console.warn('CMS fetch error:', err);
        fetch(GAS_URL).then(function(r){return r.json();}).then(function(data){ renderList(data && data.blog); }).catch(function(){ renderList([]); });
      });
    return;
  }

  // ?blog_all=1 で全件取得（Code.gs 側で対応必須）
  // 通常 doGet は最新4件しか返さないので、詳細ページは全件モードで叩く
  fetch(GAS_URL + (GAS_URL.indexOf('?') >= 0 ? '&' : '?') + 'blog_all=1')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      const item = findBySlug(data && data.blog, slug, n);
      render(item);
    })
    .catch(function(err) {
      console.warn('CMS fetch error:', err);
      // フォールバック：通常モードでも試す
      fetch(GAS_URL)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          const item = findBySlug(data && data.blog, slug, n);
          render(item);
        })
        .catch(function() { render(null); });
    });
})();
</script>

</body>
</html>
