<!--
==============================================================
ogp.svg 雛形 — 1200×630px OGP画像
==============================================================
プレースホルダーを置換してから保存：
  #2a1810       背景グラデ開始色   例: #0e0e0e
  #3d2418         背景グラデ終了色   例: #1e1a16
  #f0d090    アクセント明色     例: #f0d080
  #c9a84c          アクセント基準色   例: #c9a84c
  #a07830     アクセント暗色     例: #a07830
  #f5eadb         テキスト淡色       例: #e8d9b8
  #a89680         サブ淡色           例: #8a7a60
  CASA FLOR · OKINAWA NAGO       上部キャプション   例: PRIVATE SPA · NAHA OMOKACHO
  Casa Flor      ブランド英字       例: RAKSAA
  株式会社カーサフロール      ブランド日本語     例: タイ古式　ラクサー
  内 外 装 仕 上 げ の プ ロ 集 団       中段タグライン     例: 深 夜 2 5 時 ま で
  casaflor.search-mania.net        ドメイン           例: thai-raksaa.search-mania.net

業種に応じた色サンプル：
  カフェ系  : #f5efe5 / #e8d8b8 / #c9a84c / #b89b3f / #8a7530 / #3a342a / #6a635a
  和食系    : #1a0e08 / #2a1810 / #d4a14a / #c9a84c / #8a6020 / #f0e0c0 / #8a7a60
  美容系    : #1a1a1a / #2a2a2a / #d4af37 / #c9a84c / #a08020 / #f5f0e8 / #8a7a60
  花屋系    : #f5f0e8 / #e8e0d0 / #8a9a5b / #6e7d4a / #4a5a30 / #2a3520 / #6a635a
  歯科系    : #f8fafc / #e0eef5 / #4a90e2 / #357abd / #2868a0 / #1a2a3a / #6a7580
==============================================================
-->
